<title>Berührungs-Detektive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: ScratchJr-Editor im Kleinen – Bühne links, Programme rechts, blaue Blockleiste unten.
   Einzelnes helles Thema wie die echte App, alle Farben explizit gesetzt. */
:root {
  --paper: #f3eee2;        /* ScratchJr-Arbeitsfläche */
  --paper-edge: #e3dac6;
  --card: #ffffff;
  --ink: #2b3a4a;
  --ink-soft: #6b7a8a;
  --bar: #4a86c5;          /* blaue Blockleiste */
  --bar-dark: #2f6aa8;
  --flag: #4fb36a;
  --sun: #f7a23b;          /* Kater-Orange als Akzent */
  --ok: #3cae5c;
  --bad: #e2574c;
  --font-display: 'Fredoka', 'Andika', system-ui, sans-serif;
  --font-body: 'Andika', 'Verdana', system-ui, sans-serif;
  --bz: 0.95;              /* Blockgröße */
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 18px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; }
img { -webkit-user-drag: none; }
.app { min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: 12px 18px; max-width: 1280px; margin: 0 auto; }

/* Kopfzeile */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--bar-dark); display: flex; align-items: center; gap: 8px; }
.brand img { height: 40px; }
.dots { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--paper-edge); background: var(--card);
  font-family: var(--font-display); font-weight: 600; font-size: 18px; cursor: pointer; display: grid; place-items: center; }
.dot.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.dot.cur { border-color: var(--sun); box-shadow: 0 0 0 3px #fbd29a; }
.dot:focus-visible, .big:focus-visible, .pal-block:focus-visible { outline: 3px solid var(--bar-dark); outline-offset: 3px; }

/* Aufgabe */
.task { display: flex; align-items: flex-start; gap: 14px; background: var(--card); border: 3px solid var(--paper-edge); border-radius: 18px; padding: 10px 14px; }
.task .num { font-family: var(--font-display); font-weight: 700; font-size: 30px; width: 52px; height: 52px; flex: none; border-radius: 50%; background: var(--sun); color: #fff; display: grid; place-items: center; }
.task h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; line-height: 1.15; }
.task p { margin: 2px 0 0; font-size: 20px; line-height: 1.3; }
.task .txt { flex: 1; min-width: 0; }
.steps { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; counter-reset: st; }
.steps li { counter-increment: st; display: flex; align-items: center; gap: 8px; font-size: 19px; line-height: 1.3; flex-wrap: wrap; }
.steps li::before { content: counter(st); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--bar); color: #fff;
  font-family: var(--font-display); font-weight: 600; font-size: 17px; display: grid; place-items: center; }
.steps .ic { height: 34px; width: auto; vertical-align: middle; max-width: none; }
.steps .mini { display: inline-block; zoom: 0.5; vertical-align: middle; margin: 0 4px; }
.steps .mini .blk { height: 66px; }
.steps .mini .pill, .steps .mini .drop { display: none; }
.steps .ic.drop { height: 22px; }

/* Arbeitsbereich */
.work { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stagebox { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--paper-edge); background: #cfe9f7; }
.stage { position: absolute; left: 0; top: 0; width: 480px; height: 360px; transform-origin: 0 0; }
.stage .bg { position: absolute; inset: 0; width: 480px; height: 360px; max-width: none; }
.spr { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; transition: opacity .18s linear; cursor: default; }
.spr img { width: 100%; height: 100%; display: block; max-width: none; pointer-events: none; }
.spr.tap { cursor: pointer; }
.spr.tap::after { content: ''; position: absolute; inset: -6px; border-radius: 16px; }
.bubble { position: absolute; background: #2aa6dd; color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 15px; line-height: 1.15;
  padding: 6px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, -100%); pointer-events: none; z-index: 50; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-top-color: #2aa6dd; border-bottom: 0; }
.flyletter { position: absolute; width: 60px; height: 52px; z-index: 60; pointer-events: none; transform: translate(-50%, -50%); }
.flyletter img { width: 100%; height: 100%; max-width: none; }

.controls { display: flex; gap: 12px; align-items: center; }
.big { border: none; border-radius: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-display); font-weight: 600; font-size: 22px; min-height: 64px; padding: 0 18px; }
.go { background: var(--card); box-shadow: inset 0 0 0 3px var(--paper-edge); }
.go img { height: 50px; }
.go.hide { display: none; }
.stop { background: var(--card); box-shadow: inset 0 0 0 3px var(--paper-edge); }
.stop svg { width: 36px; height: 36px; }
.hint-tap { margin-left: auto; font-size: 17px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }

/* Programme */
.right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.scripts { background: var(--card); border-radius: 14px; border: 3px solid var(--paper-edge); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.srow { display: flex; gap: 10px; align-items: flex-start; padding: 6px; border-radius: 12px; }
.srow + .srow { border-top: 2px dashed #ece5d4; border-radius: 0; }
.who { width: 66px; flex: none; text-align: center; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.who img { width: 56px; height: 56px; object-fit: contain; display: block; margin: 0 auto 2px; max-width: none; }
.strips { display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow-x: auto; padding: 2px 4px 4px; }
.strip { zoom: var(--bz); display: flex; align-items: flex-start; padding: 4px 6px 2px 2px; border-radius: 16px; width: max-content; }
.strip.choosable { cursor: pointer; box-shadow: inset 0 0 0 4px #e3e8ee; background: #fafbfc; }
.strip.choosable.chosen { box-shadow: inset 0 0 0 5px var(--ok); background: #eaf7ee; }
.strip.choosable.chosen::after { content: '✓'; font-family: var(--font-display); font-size: 40px; color: var(--ok); align-self: center; margin-left: 10px; }
.strip.inactive { opacity: .55; }

/* Blöcke (echte ScratchJr-Formen: 76×66, Startblöcke 85×66, 12 px Überlappung) */
.blk { position: relative; width: 76px; height: 84px; flex: none; }
.blk + .blk { margin-left: -12px; }
.blk.hat { width: 85px; }
.blk > img.shape, .blk > img.icon { position: absolute; left: 0; top: 0; width: 100%; height: 66px; max-width: none; pointer-events: none; }
.blk .pill { position: absolute; left: 14px; top: 55px; min-width: 48px; height: 24px; padding: 0 6px; border: 2px solid #c0c2c3; border-radius: 12px;
  background: #fff; color: #77787b; font: 15px/20px Verdana, sans-serif; text-align: center; white-space: nowrap; max-width: 64px; overflow: hidden; text-overflow: ellipsis; }
.blk .drop { position: absolute; left: 10px; top: 56px; width: 48px; height: 27px; max-width: none; }
.blk.hat .drop { left: 20px; }
.blk .drop.edit { cursor: pointer; animation: wiggle 1.6s ease-in-out infinite; filter: drop-shadow(0 0 4px #ff9d00); }
.blk.run > img.shape { filter: brightness(1.25) drop-shadow(0 0 6px #fff59a); }
.blk.slot { border: 4px dashed #9fb3c8; border-radius: 14px; height: 66px; width: 70px; background: rgba(255,255,255,.6); margin-right: 6px; }
.blk.slot + .blk, .blk + .blk.slot { margin-left: 2px; }
.blk.slot.next { border-color: var(--sun); background: #fff4e3; }
.blk.placed { cursor: pointer; }
.blk.buggy > img.shape { filter: drop-shadow(0 0 0 #e2574c) drop-shadow(0 0 5px #e2574c); }
.blk.buggy { animation: wiggle 1.6s ease-in-out infinite; }
.count { display: flex; gap: 4px; margin-left: 6px; }
.count img { height: 40px; filter: grayscale(1) opacity(.35); }
.count img.got { filter: none; animation: pop .4s cubic-bezier(.2,1.6,.4,1) both; }
.start .big-mini { zoom: 1.1; }
.hintpulse { animation: hint 1s ease-in-out 3; border-radius: 14px; }

/* Blockleiste */
.palette { background: var(--bar); border-radius: 14px; padding: 10px 12px 6px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: flex-start; }
.palette .label { width: 100%; color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 18px; margin-bottom: 2px; }
.pal-block { zoom: var(--bz); background: none; border: none; padding: 0; cursor: pointer; border-radius: 12px; }
.pal-block.used { opacity: .3; pointer-events: none; }

/* Farbauswahl */
.pop { position: fixed; z-index: 200; background: var(--card); border-radius: 18px; padding: 10px; display: grid; grid-template-columns: repeat(3, 76px); gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 3px var(--paper-edge); }
.pop button { width: 76px; height: 66px; border: none; border-radius: 12px; background: #f3f5f8; cursor: pointer; padding: 0; }
.pop button img { width: 100%; height: 100%; max-width: none; }

/* Rückmeldung */
.overlay { position: fixed; inset: 0; z-index: 300; background: rgba(43,58,74,.55); display: grid; place-items: center; padding: 16px; }
.card { background: var(--card); border-radius: 28px; padding: 22px 20px; text-align: center; max-width: 520px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 44px; margin: 6px 0; }
.card p { font-size: 22px; margin: 6px 0 16px; }
.stars { font-size: 64px; letter-spacing: 8px; color: var(--sun); }
.stars span { display: inline-block; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.stars span:nth-child(2) { animation-delay: .15s; } .stars span:nth-child(3) { animation-delay: .3s; }
.card .big { margin: 0 auto; background: var(--ok); color: #fff; font-size: 26px; padding: 0 30px; }
.card .big.again { background: var(--sun); }
.card img.hero { height: 120px; }
.bug { font-size: 70px; display: inline-block; animation: wiggle 1s ease-in-out infinite; }

.start { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; padding-block: 24px; }
.start .card { max-width: 640px; }
.start h2 { font-size: 54px; color: var(--bar-dark); }
.start .row { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 8px 0 18px; }
.start .row img { height: 90px; }

@keyframes pulse { 50% { transform: scale(1.08); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes hint { 50% { box-shadow: 0 0 0 8px #ffb14a; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 1100px) { :root { --bz: 0.8; } }
@media (max-width: 820px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  :root { --bz: 0.7; }
  .task h1 { font-size: 21px; } .task p { font-size: 18px; }
}
@media (max-width: 480px) { .brand span { display: none; } .dot { width: 34px; height: 34px; font-size: 16px; } }
</style>

<div id="root"></div>

<script>
(() => {
'use strict';
const A = 'assets/';
const COLORS = ['Orange', 'Red', 'Yellow', 'Green', 'Blue', 'Purple'];
const COLOR_DE = { Orange: 'orange', Red: 'rot', Yellow: 'gelb', Green: 'grün', Blue: 'blau', Purple: 'lila' };
const HATS = new Set(['onflag', 'onclick', 'ontouch', 'onmessage']);
const SHAPE = { onflag: 'start', onclick: 'start', ontouch: 'start', onmessage: 'start', message: 'yellowCmd',
  forward: 'blueCmd', back: 'blueCmd', up: 'blueCmd', down: 'blueCmd', hop: 'blueCmd', home: 'blueCmd',
  wait: 'flow', setspeed: 'flow', stopmine: 'flow', say: 'looks', show: 'looks', hide: 'looks', grow: 'looks', shrink: 'looks', forever: 'endshort' };
const ICON = { onflag: 'greenFlag', onclick: 'OnTouch', ontouch: 'Bump', stopmine: 'Stop', forward: 'Foward', back: 'Back', up: 'Up', down: 'Down', hop: 'Hop',
  home: 'Home', wait: 'Wait', say: 'Say', show: 'Appear', hide: 'Disappear', grow: 'Grow', shrink: 'Shrink', forever: 'Forever' };
const NUMARG = new Set(['forward', 'back', 'up', 'down', 'hop', 'wait', 'grow', 'shrink']);
const iconFor = b => b.op === 'onmessage' ? `LetterGet_${b.arg}` : b.op === 'message' ? `LetterSend_${b.arg}`
  : b.op === 'setspeed' ? `speed${b.arg}` : ICON[b.op];
const SIZE = { Kater: [180, 170], Apple: [112, 132], Boy1: [138, 311], Soccerball: [96, 96], SoccerNet: [219, 399],
  Grandmother: [149, 407], Links: [100, 100], Rechts: [100, 100] };

// Blockkurzschrift: ['forward', 3]
const B = (op, arg, extra) => Object.assign({ op, arg }, extra || {});
const S = (...blocks) => blocks.map(b => Array.isArray(b) ? B(b[0], b[1], b[2]) : b);

// ---------------- Level ----------------
const LEVELS = [
  { title: 'Der Torschuss', steps: ['Drück die grüne Fahne {flag}.', 'Schau zu: Der Kater berührt den Ball. Dann startet das Programm vom Ball {bump}.'],
    bg: 'Park', flag: true,
    sprites: [
      { id: 'tor', name: 'Tor', img: 'SoccerNet', x: 425, y: 245, s: 0.42, scripts: [] },
      { id: 'kater', name: 'Kater', img: 'Kater', x: 70, y: 292, s: 0.45,
        scripts: [S(['onflag'], ['forward', 6])] },
      { id: 'ball', name: 'Ball', img: 'Soccerball', x: 200, y: 308, s: 0.4,
        scripts: [S(['ontouch'], ['forward', 8], ['say', 'Tor!'])] },
    ],
    order: ['kater', 'ball'], win: 'Tor! Der Ball wurde berührt.',
    goal: ev => ev.type === 'start' && ev.sprite === 'ball' && ev.hat === 'ontouch' },

  { title: 'Welches Programm?', steps: ['Der Ball soll erst rollen, wenn der Kater ihn berührt {bump}.', 'Tippe das richtige Programm vom Ball an.', 'Drück die Fahne {flag}.'],
    bg: 'Park', flag: true, choose: true,
    sprites: [
      { id: 'tor', name: 'Tor', img: 'SoccerNet', x: 425, y: 245, s: 0.42, scripts: [] },
      { id: 'kater', name: 'Kater', img: 'Kater', x: 70, y: 292, s: 0.45,
        scripts: [S(['onflag'], ['forward', 6])] },
      { id: 'ball', name: 'Ball', img: 'Soccerball', x: 200, y: 308, s: 0.4, choose: true,
        scripts: [
          S(['onflag'], ['forward', 8]),
          S(['onclick'], ['hop', 2]),
          S(['ontouch'], ['forward', 8]),
        ] },
    ],
    order: ['kater', 'ball'], hint: '[data-sprite="ball"]', win: 'Tor!',
    check: rt => rt.hats.has('ball:ontouch') && sameSet(rt.chosen.ball, [2]) },

  { title: 'Der Startblock fehlt', steps: ['Mark läuft zum Apfel. Der Apfel soll dann verschwinden {hide}.', 'Beim Apfel fehlt der Startblock. Tippe unten in der blauen Leiste auf den richtigen Block.', 'Drück die Fahne {flag}.'],
    bg: 'Fall', flag: true,
    sprites: [
      { id: 'apfel', name: 'Apfel', img: 'Apple', x: 290, y: 292, s: 0.3,

      { id: 'mark', name: 'Mark', img: 'Boy1', x: 80, y: 262, s: 0.4,

    bg: 'Fall', flag: true,
    sprites: [
      { id: 'oma', name: 'Oma', img: 'Grandmother', x: 330, y: 255, s: 0.33,
        scripts: [S(['onclick', null, { placed: true, palIdx: 0, bug: true }], ['say', 'Danke, Mark!'])] },
      { id: 'mark', name: 'Mark', img: 'Boy1', x: 80, y: 262, s: 0.4,
        scripts: [S(['onflag'], ['forward', 9])] },
    ],
    order: ['mark', 'oma'],
    palette: S(['onclick'], ['onflag'], ['ontouch'], ['onmessage', 'Orange']),
    hint: '.blk.placed, .palette', win: 'Oma freut sich.',
    goal: ev => ev.type === 'start' && ev.sprite === 'oma' && ev.hat === 'ontouch' },

  { title: 'Der Apfel kommt zurück', steps: ['Mark pflückt den Apfel {bump}. Dann soll der Apfel wieder am Baum hängen.', 'Baue für den Apfel: verschwinden {hide} + zurück zum Start {home} + erscheinen {show}.', 'Drück die Fahne {flag}.'],
    bg: 'Fall', flag: true,
    sprites: [
      { id: 'apfel', name: 'Apfel', img: 'Apple', x: 300, y: 60, s: 0.3,
        scripts: [S(['onflag'], ['down', 9]), S(['ontouch'], { slot: true }, { slot: true }, { slot: true })] },
      { id: 'mark', name: 'Mark', img: 'Boy1', x: 80, y: 262, s: 0.4,
        scripts: [S(['onflag'], ['wait', 20], ['forward', 9])] },
    ],
    order: ['mark', 'apfel'],
    palette: S(['show'], ['hop', 2], ['hide'], ['home']),
    hint: '.palette', win: 'Der Apfel hängt wieder am Baum.',
    check: rt => rt.hats.has('apfel:ontouch') && matches(rt.level.sprites[0].scripts[1], [['ontouch'], ['hide'], ['home'], ['show']]) },

  { title: 'Fang den Apfel', steps: ['Drück die Fahne {flag}. Der Apfel fällt.', 'Tippe auf die Pfeile {links} {rechts} auf der Bühne. So läuft Mark.', 'Lauf mit Mark zum Apfel und berühre ihn {bump}.'],
    bg: 'Fall', flag: true, free: true, tapHint: true,
    sprites: [
      { id: 'mark', name: 'Mark', img: 'Boy1', x: 110, y: 262, s: 0.4,
        scripts: [S(['onmessage', 'Green'], ['back', 1]), S(['onmessage', 'Orange'], ['forward', 1])] },
      { id: 'apfel', name: 'Apfel', img: 'Apple', x: 330, y: 60, s: 0.3,

      { id: 'rechts', name: 'Rechts', img: 'Rechts', x: 442, y: 322, s: 0.6, scripts: [S(['onclick'], ['message', 'Orange'])] },

    order: ['links', 'rechts', 'mark', 'apfel'],
    hint: '[data-sprite="rechts"]', win: 'Gefangen!',

  { title: 'Die richtigen Programme', steps: ['Links {links} schickt {send:Green}. Rechts {rechts} schickt {send:Orange}.', 'Tippe die 2 richtigen Programme von Mark an: links {back} und rechts {forward}.', 'Drück die Fahne {flag} und fang den Apfel.'],
    bg: 'Fall', flag: true, free: true, choose: true, tapHint: true,
    sprites: [
      { id: 'mark', name: 'Mark', img: 'Boy1', x: 360, y: 262, s: 0.4, choose: true,
        scripts: [
          S(['onmessage', 'Green'], ['forward', 1]),
          S(['onmessage', 'Orange'], ['forward', 1]),
          S(['onmessage', 'Green'], ['back', 1]),
          S(['onmessage', 'Orange'], ['up', 1]),
        ] },
      { id: 'apfel', name: 'Apfel', img: 'Apple', x: 200, y: 60, s: 0.3,

      { id: 'links', name: 'Links', img: 'Links', x: 38, y: 322, s: 0.6, scripts: [S(['onclick'], ['message', 'Green'])] },
      { id: 'rechts', name: 'Rechts', img: 'Rechts', x: 442, y: 322, s: 0.6, scripts: [S(['onclick'], ['message', 'Orange'])] },
    ],
    order: ['links', 'rechts', 'mark', 'apfel'],
    hint: '[data-sprite="mark"]', win: 'Gefangen!',
    goal: (ev, rt) => ev.type === 'start' && ev.sprite === 'apfel' && ev.hat === 'ontouch' && (sameSet(rt.chosen.mark, [1, 2]) || 'fail') },

  { title: 'Apfelernte', steps: ['Drück die Fahne {flag}. Die Äpfel fallen.', 'Fang 3 Äpfel mit Mark! Lauf mit den Pfeilen {links} {rechts}.', 'Ein gefangener Apfel {bump} hängt wieder am Baum und fällt noch einmal.'],
    bg: 'Fall', flag: true, free: true, tapHint: true, count: 3,
    sprites: [
      { id: 'mark', name: 'Mark', img: 'Boy1', x: 105, y: 262, s: 0.4,
        scripts: [S(['onmessage', 'Green'], ['back', 1]), S(['onmessage', 'Orange'], ['forward', 1])] },
      { id: 'apfel1', name: 'Apfel', img: 'Apple', x: 160, y: 50, s: 0.3,
        scripts: [S(['onflag'], ['down', 10]), S(['ontouch'], ['stopmine'], ['hide'], ['home'], ['wait', 10], ['show'], ['down', 10])] },
      { id: 'apfel2', name: 'Apfel', img: 'Apple', x: 270, y: 50, s: 0.3,

      h('img', { src: `${A}sprites/Apple.svg`, alt: '', class: k < n ? 'got' : '' })));
  }
  idle() {
    if (this.won || this.lv.free) return;
    if (this.lv.check) { if (this.lv.check(this.rt)) return this.win(); return this.fail(); }
    // Fahne gelaufen, aber Ziel nicht erreicht
    if (this.lv.flagIsSetup && this.rt.lastAction === 'flag') return; // erst Fahne, dann Knopf
    setTimeout(() => { if (!this.won && !this.rt.active) this.fail(); }, 300);
  }
  pulse(sel) {
    if (!sel) return;
    document.querySelectorAll(sel).forEach(e => { e.classList.remove('hintpulse'); void e.offsetWidth; e.classList.add('hintpulse'); });
  }
  win() {
    this.won = true;
    setTimeout(() => {
      this.done.add(this.idx); store.set('td-done', [...this.done]);
      const last = this.idx === LEVELS.length - 1;
      const msg = last ? 'Alle Rätsel gelöst!' : ['Super gemacht!', 'Toll!', 'Klasse!', 'Prima!'][this.idx % 4];
      this.showOverlay(h('div', { class: 'card' },
        h('div', { class: 'stars' }, h('span', {}, '★'), h('span', {}, '★'), h('span', {}, '★')),
        h('h2', {}, last ? 'Geschafft!' : msg),
        h('p', {}, this.lv.win || 'Berührt!'),
        h('button', { class: 'big', onclick: () => { this.hideOverlay(); if (last) { this.idx = 0; this.startScreen(); } else this.load(this.idx + 1); } },
          last ? 'Nochmal von vorn' : 'Weiter ▶')));
    }, 1800);
  }
  fail() {
    if (this.won || this.overlay) return;
    this.fails++;
    const msg = 'Hmm, noch nicht. Schau genau hin!';
    this.showOverlay(h('div', { class: 'card' },
      h('div', { class: 'bug' }, '🐞'), h('h2', {}, 'Noch nicht!'), h('p', {}, 'Schau genau hin.'),
      h('button', { class: 'big again', onclick: () => { this.hideOverlay(); this.rt.reset(); if (this.fails >= 2) this.pulse(this.lv.hint); } }, 'Nochmal ↺')));
  }
  showOverlay(card) { this.overlay = h('div', { class: 'overlay' }, card); document.body.append(this.overlay); card.querySelector('button').focus(); }
  hideOverlay() { this.overlay && this.overlay.remove(); this.overlay = null; }
}
function stepsEl(steps) {
  const icon = tok => {
    const [k, c] = tok.split(':');
    if (k === 'drop') return h('img', { class: 'ic drop', src: `${A}blocks/dropdown.svg`, alt: '' });
    if (k === 'links' || k === 'rechts') return h('img', { class: 'ic', src: `${A}sprites/${k === 'links' ? 'Links' : 'Rechts'}.svg`, alt: k });
    const b = { flag: { op: 'onflag' }, send: { op: 'message', arg: c }, get: { op: 'onmessage', arg: c }, forward: { op: 'forward', arg: 1 },
      down: { op: 'down', arg: 1 }, home: { op: 'home' }, back: { op: 'back', arg: 1 }, bump: { op: 'ontouch' }, tap: { op: 'onclick' },
      hide: { op: 'hide' }, show: { op: 'show' } }[k];
    return h('span', { class: 'mini' }, blockEl(b));
  };
  return h('ol', { class: 'steps' }, steps.map(st => h('li', {}, h('span', {},
    st.split(/(\{[^}]+\})/).map(part => part.startsWith('{') ? icon(part.slice(1, -1)) : part)))));
}
function svgIcon(inner) { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = inner; return s; }

const game = new Game(document.getElementById('root'));
game.startScreen();
})();
